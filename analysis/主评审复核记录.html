<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCon26 分析材料</title>
<style>
:root{--ink:#173b34;--muted:#596b64;--line:#d7dfd8;--brand:#176c59}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#f3f4ee;color:#263d35;font:16px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:920px;margin:36px auto;padding:42px 56px;background:white;min-height:80vh;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.topbar{margin:0 0 8px;font-size:14px;color:var(--muted)}
.topbar a{color:var(--brand);text-decoration:none}
.loading{color:var(--muted);padding:24px 0}
h1{font-size:30px;color:var(--ink);margin:24px 0 16px}
h2{font-size:23px;color:var(--ink);margin:40px 0 16px;padding-top:12px;border-top:2px solid var(--line)}
h3{font-size:19px;color:var(--ink);margin:28px 0 12px}
h4{font-size:16px;color:var(--ink);margin:20px 0 10px}
p{margin:14px 0}a{color:var(--brand)}a:hover{text-decoration:underline}
ul,ol{padding-left:24px;margin:14px 0}li{margin:6px 0}
code{background:#f0f2ed;padding:2px 6px;border-radius:3px;font-size:14px;overflow-wrap:anywhere}
pre{background:#f0f2ed;padding:14px 16px;border-radius:6px;overflow:auto;font-size:13.5px;line-height:1.6}
pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%;margin:18px 0;font-size:14px;line-height:1.6}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:#e9efe9;font-weight:600}tr:nth-child(even){background:#f8faf6}
blockquote{border-left:4px solid var(--brand);background:#e9efe9;padding:10px 16px;margin:18px 0;color:var(--ink);border-radius:0 4px 4px 0}
img{max-width:100%;height:auto}hr{border:none;border-top:2px solid var(--line);margin:32px 0}
@media(max-width:680px){main{margin:0;padding:22px}h1{font-size:25px}}
@media print{body{background:white}main{margin:0;padding:0;box-shadow:none}}
</style>
</head>
<body>
<main>
<p class="topbar"><a href="../index.html">← 返回首页</a></p>
<div id="content" class="loading">正在加载内容……（需要联网拉取 marked.js）</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const mdUrl = location.pathname.replace(/\.html$/, '.md');
fetch(mdUrl).then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}).then(t => {
  document.getElementById('content').innerHTML = marked.parse(t, { gfm: true, breaks: false });
  const h1 = document.querySelector('#content h1');
  if (h1) document.title = h1.textContent + ' · QCon26 分析';
}).catch(e => {
  document.getElementById('content').innerHTML =
    '<p>内容加载失败：' + e.message + '<br>请直接打开同目录下对应的 .md 源文，或在 GitHub 上查看。</p>';
});
</script>
</body>
</html>
